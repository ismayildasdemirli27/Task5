<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 — Live Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Character Counter</h1>
        <p class="subtitle">Type below to see real-time character count and limits</p>

        <textarea
            id="message"
            maxlength="100"
            placeholder="Write your message..."
            rows="5"
        ></textarea>

        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="counter-info">
            <p id="remaining">Remaining: 100</p>
            <p id="counter">0 / 100</p>
        </div>

        <div class="actions">
            <button id="clearBtn" class="btn btn-clear">Clear</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
