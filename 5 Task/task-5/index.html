<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5 — Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-card">
        <h1>Task Management System</h1>
        <p class="subtitle">Organize and manage your daily tasks efficiently</p>

        <form id="taskForm" class="task-form">
            <input id="taskInput" type="text" placeholder="Enter a task..." autocomplete="off">
            <button type="submit" class="btn btn-primary">Add Task</button>
        </form>

        <div id="filters" class="filters-container">
            <button type="button" class="filter-btn active" data-filter="all">All</button>
            <button type="button" class="filter-btn" data-filter="active">Active</button>
            <button type="button" class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div class="counters-container">
            <p id="totalTasks">Total: 0</p>
            <p id="completedTasks">Completed: 0</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
