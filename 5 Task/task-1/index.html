<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 — Interactive Color Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Color Changer</h1>
        <p class="subtitle">Click a button to change the box's background color and label</p>

        <div id="colorBox">Gray</div>

        <div class="button-group">
            <button id="redBtn" class="btn btn-red">Red</button>
            <button id="greenBtn" class="btn btn-green">Green</button>
            <button id="blueBtn" class="btn btn-blue">Blue</button>
            <button id="resetBtn" class="btn btn-reset">Reset</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
